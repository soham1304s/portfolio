      <stop offset=".55" stop-color="#FFD977" stop-opacity=".22" />
      <stop offset="1" stop-color="#FFD977" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="skin-head" x1="911" y1="280" x2="1173" y2="472" gradientUnits="userSpaceOnUse">
